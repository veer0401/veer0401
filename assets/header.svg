<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Veer Patwa, Java Backend and AI Engineer">
  <title>Veer Patwa, Java Backend and AI Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="1" stop-color="#151726"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8bff"/>
      <stop offset="1" stop-color="#67d4ff"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f8bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8f8bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67d4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#67d4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>

  <style>
    .name { font: 700 56px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: url(#ink); letter-spacing: -1px; }
    .role { font: 500 22px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #ecedf6; }
    .meta { font: 400 15px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #9096ad; }
    .cursor { fill: #67d4ff; animation: blink 1.1s steps(1) infinite; }
    .o1 { animation: drift1 14s ease-in-out infinite alternate; }
    .o2 { animation: drift2 18s ease-in-out infinite alternate; }
    .rise { opacity: 0; transform: translateY(12px); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift1 { to { transform: translate(120px, 30px); } }
    @keyframes drift2 { to { transform: translate(-140px, -20px); } }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .o1, .o2, .cursor, .rise { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <circle class="o1" cx="180" cy="40" r="220" fill="url(#orb1)"/>
    <circle class="o2" cx="860" cy="230" r="240" fill="url(#orb2)"/>
    <rect x="0.5" y="0.5" width="999" height="259" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.13"/>

    <text class="name rise d1" x="56" y="108">Veer Patwa</text>
    <text class="role rise d2" x="58" y="152">Java Backend &amp; AI Engineer</text>
    <text class="meta rise d3" x="58" y="196">Spring Boot &#183; Microservices &#183; Couchbase &#183; Agentic AI</text>
    <text class="meta rise d3" x="58" y="222">Ahmedabad, India</text>
    <rect class="cursor" x="360" y="204" width="9" height="18" rx="2"/>
  </g>
</svg>
