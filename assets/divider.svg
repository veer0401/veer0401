<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8f8bff"/>
      <stop offset="1" stop-color="#67d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .bar { transform-origin: center; animation: pulse 3.5s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; transform: scaleX(.92); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect class="bar" x="0" y="3" width="1000" height="2" rx="1" fill="url(#g)"/>
</svg>
